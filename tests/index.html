<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests – Caisse Joséphine</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; color: #1D1B1A; background: #fff; }
    h1 { font-size: 22px; } li { padding: 4px 0; } .ok { color: #1B8A4B; } .ko { color: #C46000; font-weight: 600; }
    #bilan { font-size: 20px; font-weight: 700; margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Tests automatisés des calculs</h1>
  <ul id="liste"></ul>
  <p id="bilan">Calcul en cours…</p>
  <script type="module">
    import { bilan } from './calc.test.js';
    const ul = document.getElementById('liste');
    for (const r of bilan.resultats) {
      const li = document.createElement('li');
      li.className = r.ok ? 'ok' : 'ko';
      li.textContent = (r.ok ? '✔ ' : '✘ ') + r.nom + (r.ok ? '' : ' — ' + r.err);
      ul.appendChild(li);
    }
    const n = bilan.resultats.length, ko = bilan.ko.length;
    const b = document.getElementById('bilan');
    b.textContent = ko ? `${ko} test(s) en échec sur ${n}` : `Les ${n} tests sont réussis.`;
    b.className = ko ? 'ko' : 'ok';
  </script>
</body>
</html>
